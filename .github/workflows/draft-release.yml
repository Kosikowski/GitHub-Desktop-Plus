name: 'Draft Release'

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - plus
          - beta
          - production
      ref:
        description:
          'Branch or tag to release from (default: development). Use for
          hotfixes.'
        required: false
        type: string
      dry-run:
        description:
          'Compute the next version without creating a release branch'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    name: Draft Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ inputs.ref || github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: yarn

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Determine previous and next versions
        id: version
        env:
          # The plus channel anchors X.Y.Z to upstream's latest stable via
          # `gh release list --repo desktop/desktop`, which needs a token.
          GH_TOKEN: ${{ github.token }}
        run: >
          yarn ts-node -P script/tsconfig.json script/draft-release/ci.ts
          version ${{ inputs.channel }}

      - name: Show planned release in step summary
        env:
          CHANNEL: ${{ inputs.channel }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          NEXT: ${{ steps.version.outputs.next }}
        run: |
          {
            echo "## Draft Release — $NEXT"
            echo ""
            echo "- Channel: \`$CHANNEL\`"
            echo "- Previous: \`$PREVIOUS\`"
            echo "- Next: \`$NEXT\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release branch and open PR
        if: ${{ inputs.dry-run == false }}
        env:
          GH_TOKEN: ${{ github.token }}
          # In a fork, gh pr create targets the parent repo (desktop/desktop)
          # by default and fails with "Resource not accessible by
          # integration" — pin it to this repo.
          GH_REPO: ${{ github.repository }}
          CHANNEL: ${{ inputs.channel }}
          NEXT_VERSION: ${{ steps.version.outputs.next }}
          REF_OVERRIDE: ${{ inputs.ref }}
        run: |
          BRANCH="releases/$NEXT_VERSION"

          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "::error::Branch $BRANCH already exists. Delete it first or use dry-run."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # We're already on the right ref from the checkout step
          # (inputs.ref or the default branch).
          git checkout -b "$BRANCH"
          if [ -n "$REF_OVERRIDE" ]; then
            echo "🔧 Hotfix: branched from $REF_OVERRIDE"
          else
            echo "📦 Branched from ${GITHUB_REF_NAME:-$(git rev-parse --abbrev-ref HEAD)}"
          fi

          # Bump app/package.json and prepend an empty changelog entry that
          # the human will fill in on the PR. Keeping entries empty here
          # avoids depending on AI release-notes generation.
          yarn --silent ts-node -P script/tsconfig.json \
            script/draft-release/ci.ts prepare "$NEXT_VERSION" "[]"

          # Make sure changelog.json passes Prettier (ci.ts writes via
          # JSON.stringify which differs from Prettier's formatting).
          yarn prettier --write changelog.json

          git add app/package.json changelog.json
          git commit -m "Draft release $NEXT_VERSION"
          git push origin "$BRANCH"
          echo "✅ Pushed $BRANCH"

          # Default GITHUB_TOKEN cannot create a PR that itself triggers
          # other workflows, but it can create the draft PR. Subsequent
          # commits on the branch (the human filling in notes) will trigger
          # CI normally.
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$BRANCH" \
            --title "Release $NEXT_VERSION" \
            --body "Draft release for \`$NEXT_VERSION\`. Fill in changelog entries in \`changelog.json\` before merging." \
            --draft
          echo "✅ Opened draft PR for $BRANCH"
