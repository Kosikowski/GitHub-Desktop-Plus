name: 'Publish Release'

# Fires when a Draft Release PR (branch `releases/<version>`) is merged into
# `development`. Builds all four platform artifacts via the shared ci.yml,
# tags the merge commit `release-<version>`, and creates a GitHub Release
# with the changelog.json entry as release notes.
#
# Can also be dispatched manually to re-publish a version whose automatic
# run failed; every step is idempotent.

on:
  pull_request:
    types: [closed]
    branches: [development]
  # Manual re-publish for when the automatic run failed after the release
  # PR was already merged. Run it from the ref you want to release (the
  # release tag or the merge commit's branch); the tag and release steps
  # are idempotent.
  workflow_dispatch:
    inputs:
      version:
        description:
          'Version to publish, e.g. 3.6.4-plus.1 (no release- prefix)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  detect:
    name: Detect release branch
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       startsWith(github.event.pull_request.head.ref, 'releases/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.parse.outputs.version }}
      tag: ${{ steps.parse.outputs.tag }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
      sha: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
    steps:
      - name: Parse version from branch name
        id: parse
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${BRANCH#releases/}"
          fi

          # Beta and test releases are GitHub prereleases; plus and bare
          # production releases are not. update.electronjs.org only serves
          # non-prerelease releases.
          if [[ "$VERSION" == *-beta* || "$VERSION" == *-test* ]]; then
            PRERELEASE=true
          else
            PRERELEASE=false
          fi

          {
            echo "version=$VERSION"
            echo "tag=release-$VERSION"
            echo "prerelease=$PRERELEASE"
          } >> "$GITHUB_OUTPUT"

          echo "📦 Releasing $VERSION (prerelease=$PRERELEASE)"

  build:
    name: Build
    needs: detect
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/ci.yml
    with:
      repository: ${{ github.repository }}
      ref: ${{ needs.detect.outputs.sha }}
      upload-artifacts: true
      environment: release
      sign: false
    secrets: inherit

  publish:
    name: Tag and publish GitHub Release
    needs: [detect, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.detect.outputs.sha }}

      - name: Tag the merge commit
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          SHA: ${{ needs.detect.outputs.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Idempotent so a failed publish can be re-run: a tag that already
          # points at the right commit is fine, anything else is an error.
          EXISTING=$(git ls-remote --tags origin "refs/tags/$TAG" | cut -f1)
          if [ -n "$EXISTING" ]; then
            if [ "$EXISTING" = "$SHA" ]; then
              echo "Tag $TAG already points at $SHA — nothing to do."
              exit 0
            fi
            echo "::error::Tag $TAG already exists and points at $EXISTING (expected $SHA). Refusing to overwrite."
            exit 1
          fi

          git tag "$TAG" "$SHA"
          git push origin "$TAG"
          echo "✅ Pushed tag $TAG → $SHA"

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Extract release notes from changelog.json
        id: notes
        env:
          VERSION: ${{ needs.detect.outputs.version }}
        run: |
          # changelog.json has the shape { "releases": { "<version>": [ "entry", ... ] } }
          NOTES=$(jq -r --arg v "$VERSION" '
            if .releases[$v] == null then
              "_No changelog entry found for \($v) — fill in changelog.json before the next release._"
            elif (.releases[$v] | length) == 0 then
              "_No changelog entries for this release._"
            else
              .releases[$v] | map("- " + .) | join("\n")
            end
          ' changelog.json)

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
          NOTES: ${{ steps.notes.outputs.notes }}
        run: |
          PRERELEASE_FLAG=""
          LATEST_FLAG="--latest"
          if [ "$PRERELEASE" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
            LATEST_FLAG=""
          fi

          # Flatten the per-job artifact directories produced by
          # actions/download-artifact@v4 into a flat asset list. Read into an
          # array rather than a word-split string so paths survive verbatim.
          #
          # The e2e-* artifacts hold Playwright debug output, including
          # trace-*.zip files that must never end up on a public release, so
          # skip those directories entirely.
          ASSETS=()
          while IFS= read -r asset; do
            ASSETS+=("$asset")
          done < <(find artifacts -type f \
            -not -path 'artifacts/e2e-*' \
            \( -name '*.zip' -o -name '*.exe' -o -name '*.msi' -o -name '*.nupkg' \))

          if [ "${#ASSETS[@]}" -eq 0 ]; then
            echo "::error::No build artifacts found to attach to the release"
            exit 1
          fi

          echo "Attaching ${#ASSETS[@]} assets:"
          printf '  %s\n' "${ASSETS[@]}"

          # Idempotent so a failed publish can be re-run: if the release
          # already exists just (re-)upload the assets. `gh release create`
          # creates the release as a draft and only publishes it once every
          # asset finished uploading, so a run that died mid-upload leaves a
          # draft behind — publish it explicitly rather than leaving a
          # release nobody can see.
          if gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            echo "Release $TAG already exists — uploading assets to it."
            gh release upload "$TAG" \
              --repo "${{ github.repository }}" \
              --clobber \
              "${ASSETS[@]}"

            IS_LATEST=true
            if [ "$PRERELEASE" = "true" ]; then
              IS_LATEST=false
            fi

            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --draft=false \
              --prerelease="$PRERELEASE" \
              --latest="$IS_LATEST"
          else
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "GitHub Desktop + $VERSION" \
              --notes "$NOTES" \
              $PRERELEASE_FLAG $LATEST_FLAG \
              "${ASSETS[@]}"
          fi

          echo "✅ Published release $TAG"

      - name: Summary
        if: always()
        env:
          TAG: ${{ needs.detect.outputs.tag }}
          VERSION: ${{ needs.detect.outputs.version }}
          PRERELEASE: ${{ needs.detect.outputs.prerelease }}
        run: |
          {
            echo "## Release published"
            echo ""
            echo "- Tag: \`$TAG\`"
            echo "- Version: \`$VERSION\`"
            echo "- Prerelease: \`$PRERELEASE\`"
            echo ""
            echo "[View release](https://github.com/${{ github.repository }}/releases/tag/$TAG)"
          } >> "$GITHUB_STEP_SUMMARY"
